
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>SkillExchange</h2>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
            <a href="students.html">Students</a>
        </div>
    </nav>

    <section class="form-section">
        <div class="form-card">

            <h1>Student Registration</h1>
            <p>Join our community and exchange your skills.</p>

            <form id="registerForm">

                <label>Full Name</label>
                <input type="text" id="name"
                    placeholder="Enter your full name" required>

                <label>Email Address</label>
                <input type="email" id="email"
                    placeholder="Enter your email" required>

                <label>Skill You Can Teach</label>
                <input type="text" id="teach"
                    placeholder="Example: Python" required>

                <label>Skill You Want to Learn</label>
                <input type="text" id="learn"
                    placeholder="Example: Java" required>

                <button type="submit" class="btn full-btn">
                    Register Now
                </button>

            </form>

            <p id="message"></p>

        </div>
    </section>

    <footer>
        <p>© 2026 Student Skill Exchange Platform</p>
    </footer>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const studentData = {
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                teach: document.getElementById("teach").value.trim(),
                learn: document.getElementById("learn").value.trim()
            };

            try {
                const response = await fetch("/api/students/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(studentData)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || "Registration failed");
                }

                message.textContent = "Registration Successful!";
                message.className = "success-message";

                form.reset();

            } catch (error) {
                message.textContent = error.message;
                message.className = "error-message";
            }
        });
    </script>

</body>
</html>
